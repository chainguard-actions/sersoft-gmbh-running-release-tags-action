name: Test suffix-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: v1.2.3-stable
          prefix-regex: 'v?'
          suffix-regex: '(-stable)?'
          fail-on-non-semver-tag: 'false'
          skip-repo-setup: 'true'
          update-major: 'true'
          update-minor: 'true'
          create-release: 'false'
          dry-run: 'true'
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with suffix-regex input"
          echo "PASS"
