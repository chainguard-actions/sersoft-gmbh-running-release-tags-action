name: Test suffix-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3-stable
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: v1.2.3-stable
          suffix-regex: '-stable'
          update-major: 'true'
          update-minor: 'true'
          create-release: 'false'
          skip-repo-setup: 'false'
          dry-run: 'true'
      - name: Assert action completed successfully with suffix-regex
        run: |
          echo "Action completed with suffix-regex input set to '-stable'"
          echo "PASS"
