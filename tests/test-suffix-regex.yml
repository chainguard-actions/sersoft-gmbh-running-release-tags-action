name: Test suffix-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          tag: v1.2.3-stable
          prefix-regex: 'v?'
          suffix-regex: '(-stable)?'
          fail-on-non-semver-tag: 'false'
          skip-repo-setup: 'true'
          update-major: 'true'
          update-minor: 'true'
          create-release: 'false'
          dry-run: 'true'
        continue-on-error: true
      - name: Assert action ran with suffix-regex input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with suffix-regex input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail gracefully on sentinel repo) with suffix-regex input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
