name: Test bare semver tag without v prefix (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          create-release: 'false'
          prefix-regex: 'v?'
          update-major: 'true'
          update-minor: 'true'
          fail-on-non-semver-tag: 'false'
      - name: Assert action succeeded with bare semver tag
        run: |
          echo "Action completed successfully for bare semver tag 1.2.3 (no v prefix)"
          echo "PASS"
