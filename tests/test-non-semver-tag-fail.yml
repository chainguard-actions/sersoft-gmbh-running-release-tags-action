name: Test non-semver tag with fail-on-non-semver-tag true (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/not-a-semver-tag
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          create-release: 'false'
          fail-on-non-semver-tag: 'true'
      - name: Assert action failed on non-semver tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-semver tag, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-semver tag"
