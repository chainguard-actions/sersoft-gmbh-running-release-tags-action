name: Test explicit tag input (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: v2.5.0
          dry-run: 'true'
          create-release: 'false'
          update-major: 'true'
          update-minor: 'true'
          fail-on-non-semver-tag: 'false'
      - name: Assert action succeeded with explicit tag
        run: |
          echo "Action completed successfully with explicit tag v2.5.0"
          echo "PASS"
