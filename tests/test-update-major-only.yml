name: Test update major tag only (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          create-release: 'false'
          update-major: 'true'
          update-minor: 'false'
          fail-on-non-semver-tag: 'false'
      - name: Assert action succeeded with major-only update
        run: |
          echo "Action completed successfully with update-major=true, update-minor=false"
          echo "PASS"
