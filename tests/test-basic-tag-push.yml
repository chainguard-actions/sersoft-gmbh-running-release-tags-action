name: Test basic tag push (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/v1.2.3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          create-release: 'false'
          update-major: 'true'
          update-minor: 'true'
          skip-repo-setup: 'true'
      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with semver tag v1.2.3"
          echo "PASS"
