name: Test basic tag push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: 'true'
      RUNNER_DEBUG: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: v1.2.3
          dry-run: 'true'
          create-release: 'false'
          skip-repo-setup: 'true'
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully in dry-run mode with tag v1.2.3"
          echo "PASS"
