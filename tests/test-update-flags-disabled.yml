name: Test update-major and update-minor disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: 'true'
      RUNNER_DEBUG: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: v3.1.0
          dry-run: 'true'
          create-release: 'false'
          skip-repo-setup: 'true'
          update-major: 'false'
          update-minor: 'false'
      - name: Assert action completed without error when both update flags are disabled
        run: |
          echo "Action completed successfully with update-major=false and update-minor=false"
          echo "PASS"
