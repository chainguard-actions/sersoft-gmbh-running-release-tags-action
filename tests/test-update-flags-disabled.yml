name: Test with update-major and update-minor disabled (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/v3.1.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          create-release: 'false'
          update-major: 'false'
          update-minor: 'false'
          skip-repo-setup: 'true'
      - name: Assert action succeeded with updates disabled
        run: |
          echo "Action completed successfully with major and minor updates disabled"
          echo "PASS"
