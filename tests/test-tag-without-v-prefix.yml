name: Test tag without v prefix (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: '1'
      TEST_GITHUB_REF: refs/tags/1.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          create-release: 'false'
          prefix-regex: 'v?'
          update-major: 'true'
          update-minor: 'true'
          skip-repo-setup: 'true'
      - name: Assert action succeeded with tag without v prefix
        run: |
          echo "Action completed successfully with tag '1.0.0' (no v prefix)"
          echo "PASS"
