name: Test tag without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: 'true'
      RUNNER_DEBUG: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag: '1.0.0'
          dry-run: 'true'
          create-release: 'false'
          skip-repo-setup: 'true'
      - name: Assert action completed with tag without v prefix
        run: |
          echo "Action completed successfully with tag '1.0.0' (no v prefix)"
          echo "PASS"
